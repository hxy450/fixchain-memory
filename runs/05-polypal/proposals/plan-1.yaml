  description: 源端宿主经 flutter_boost 挂载的是自定义 FlutterBoostFragment 子类，在其中 addEventListener(通道名) 分发 Flutter 事件、sendEventToFlutter 反向推数据；事件名常量、桥接 Model 与宿主分散在不同源文件；契约可能把这类桥接标成“待 Feature Spec”。
