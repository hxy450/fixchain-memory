- title: 规格需要的值在上游清单或数据源里取不到时，回源码补全或标“待核”，不用端点计数、枚举举例或自拟值收口
  topic:
  - process
  - spec-handoff
  when: 规格提取阶段，依赖 API 清单等上游产物写网络层、鉴权、服务地址等小节时；上游产物缺失、结果被截断，或所指数据源里没有所需值时
  description: 规格模板要求某小节取自上游工具的最终产物（如 api-inventory.json 的 auth_model、common.md），该产物没有落盘，只剩中间文件（如 raw_apis.json）；中间文件只给出键名、标签或计数，没有 host、请求头、错误码等具体值。
  unless: []
  why: 用手头的中间文件填模板，小节看起来完整，下游会当成已核事实照写；中间文件里没有的值被计数、枚举举例或脚手架注释顶替。来源中这四处都出自同一个规格作者：它已确认最终清单未生成，仍把网络层标为“数据源已就绪”并删掉待补标记；认证小节没列拦截器注入的公共头，没写凭证取自响应头，把错误码枚举里的一句举例写成踢登条件，只看到地址键名就写下自拟的环境名。下游实现者全部照规格落地，直到用户实机调试才逐项暴露。
  how:
