- title: 用字符串拼接替代 Retrofit 时，在拼接函数里统一处理 baseUrl 与 path 之间的斜杠，不依赖各接口 path 的写法
  topic:
  - data
  - network
  when: 网络层实现阶段，把 Retrofit 接口迁成自写 HttpClient，确定 baseUrl 常量与各 Service 的 path 如何连成完整 URL 时
  description: 源端用 Retrofit 的 baseUrl 加 @GET/@POST 相对路径（多数不带前导 /，少数带），目标端改用 @kit.NetworkKit http 手工拼 URL；参考模板示范 `${baseUrl}${path}` 直接拼接；baseUrl 常量与各 Service 的 path 分散在不同文件里声明。
  unless: []
  why: Retrofit 按 baseUrl 解析相对路径，分隔符由框架处理；手工直接拼接时分隔符只能由其中一侧提供。模板示例是无尾斜杠的 baseUrl 配带前导 / 的 path，照搬拼接方式却按 Retrofit 注解把 path 写成无前导 /，两侧都不带分隔符，host 与路径粘在一起（形如 api.example.colivetranslator/...），请求报无法解析主机，表象像网络不通。来源中同一生成者照模板写拼接，把 60 个 path 的前导 / 全部去掉（连源端原本带 / 的 12 个也去掉），自拟的 baseUrl 也无尾斜杠，自检只查占位符，没有实际拼一次 URL。
  how:
  - 在 HttpClient 的拼接函数里做规范化：path 以 http(s):// 开头时直接使用；否则去掉 baseUrl 尾部的 / 与 path 前导的 /，再用一个 / 连接。各 Service 的 path 写法因此不影响结果。
  - 沿用参考模板的拼接方式时同时沿用它的 path 形式；按源 Retrofit 注解改写 path（去掉或保留前导 /）后，回头确认拼接函数仍成立。
  - 落盘前用当前的 baseUrl 常量和一个真实接口 path 拼一次完整 URL，确认 host 与路径之间恰好一个 /。
  evidence:
  - case: case-fef2528dd5d4c3b040e6
    claim: diagnosis
    revision: fd9a2ab9d2cf0254fcfc483224901e2235c44a3668c97158311c043845d4cf05
  - case: case-fef2528dd5d4c3b040e6
