  when: 界面、流程实现与页面接线阶段，把源页面对异步操作结果的观察（LiveData observe 等）改成目标页面的 await 结果、try/catch 或路由枚举，并决定各分支的跳转与反馈时
  description: 源 Activity 在结果观察回调里按成功/失败分支同时做几件事（写本地标记、跳页并 finish、showToast）；目标 ViewModel 方法只更新状态，或把失败折叠成返回值，由页面决定导航和提示；页面里可能留有“登录成功跳 X”的注释或 TODO。
  unless: []
  why: 分支动作在转述计划、改写异步调用时最容易被概括成“失败留页”“调用登录”这样一句话，其余副作用随之丢掉；只接上调用、不处理结果时，编译和页面显示都正常，点完没有去向或失败没有提示。来源两例：启动链路迁移者读过源端失败分支的 showToast，自己的梳理里也写着“失败 → toast”，到计划只剩导航，代码照计划漏了提示；页面接线者读到 TODO 和“登录成功跳主页”的注释，只接上登录调用，不等结果、不跳转，还删了 TODO。
  how:
  - 从源端的结果观察者（如 initObserve 里对 xxxFinished 的处理）按分支列出全部动作：跳转与关页、toast/弹窗、标记写入；计划和代码逐项对照，不把分支简化成只导航或只留页。
