  why: 宿主 Activity 里只看得到“挂一个 Fragment”，事件通信写在 Fragment 子类里；不打开它，迁移结果就只剩容器，编译和页面显示都正常，到点击交互才没有反应。来源中首页宿主被整页写过几次，写者读过事件常量表，也看到宿主调用了向 Flutter 推送的方法，写出来仍只有容器；规格作者也没读宿主源码，把事件锚到了别的页面，切片又把事件项丢了。
