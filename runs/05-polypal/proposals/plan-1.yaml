topic_descriptions:
  data: 数据层：网络请求与鉴权、本地数据库的建表与版本迁移、预置数据播种、JSON 解析与模型类型映射（含 64 位整数）
  data/network: 网络层：服务地址与环境、URL 拼接、拦截器注入的公共请求头、请求体字段、登录凭证来源与失效踢登
  data/model: 模型类型之间的映射：持久化枚举字符串与页面本地类型，源端 Long 等 64 位整数到 ArkTS 类型及其保精度解析
  app: 应用级入口与横切约定：入口 Ability 的初始化、平台级守护与 skills 声明，冷启动链路，Flutter 混合工程的原生桥接，日志写法、应用身份、设置项与平台能力
  app/entry: 入口 Ability（onCreate/onDestroy）：基础设施的显式初始化时机、需要补上的平台级守护，以及 module.json5 中入口 Ability 的 skills（深链）声明
  app/startup: 冷启动链路：闪屏路由、各去向页的初始化请求，以及登录态组合在哪里处理
  app/hybrid: Flutter 与原生混合工程：MethodChannel handler 的方法集合、flutter_boost 宿主页的事件通道、原生路由分流
  ui/feedback: 操作结果反馈：异步结果各分支的提示与去向，Snackbar 一类提示的宿主、时长与成功/失败态渲染
  process/spec-handoff: 规格、已生成代码等二手输入与源码之间的交接：规格条目的写法、上游产物缺值时如何收口、概括出错、照搬前核对与冲突回报
  process/input-loading: 写前输入是否真的进入上下文：必读 skill、规格、参考与源码片段的读取方式，派工要求的源码核对，以及编排者接手切片时要加载的输入
