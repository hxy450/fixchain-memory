- id: lesson-e9c6e8ef1b29a6fe9c26
  title: 沿用已生成页面、兄弟任务的写法或已有解析函数前，回到源码核对该片段的语义
  topic:
  - process
  - spec-handoff
  when: 页面转换、公共组件抽取、切片接线或页面重建阶段，参照已生成页面中的同名控件、弹窗、列表或顶栏写法时；数据层为新增接口方法复用已有的解析、封装函数时
  description: 后写的 worker 同时读到源码与先前 agent 已生成的目标代码片段（@Builder 控件、输入弹窗、列表键函数、顶栏折叠、登录结果解析函数等），准备当作项目约定直接沿用。
  unless: []
  why: 已生成片段可能带着偏差，照搬会把它复制到新文件，形成多处同源缺陷。来源跨三个应用：公共组件逐字沿用页面里的 @Builder 值参写法与输入框 onChange 限长，列表页重建沿用只含 id 的 ForEach 键；另一应用里两位设置页转换者都读到了源端连续折叠顶栏的写法，前一位沿用兄弟页的两态近似并称之为项目约定，后一位把前一位的输出当作“约定锚点”再抄一次；第三个应用里写者读到源端新登录方法从响应头取凭证，仍复用了已有的按响应体解析的函数，把同一偏差扩到新方法。写者都读过源码，却以已有代码为准。
  how:
  - 沿用前逐个核对片段在源码里对应的行为：参数是否随状态变化、输入约束是否真的阻止显示、条目更新后键是否变化、折叠是否连续、取值来源（响应头还是响应体）是否相同；核对通过再落盘，已有代码不能代替对源码的核对。
  - 已有写法与本处源码不一致时按源码实现，并在报告写明差异，不把近似复制到新文件。
