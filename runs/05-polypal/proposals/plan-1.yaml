- title: 源端拦截器统一注入的请求头逐条迁到 HttpClient 默认头，头名与格式以源码为准，不照模板写 Bearer 前缀
  topic:
  - data
  - network
  when: 网络基础层实现阶段，写 HttpClient 默认请求头与 Authorization 取值格式时
  description: '源端用 OkHttp 拦截器（如 TokenInterceptor）给每个请求加鉴权、语言、平台、地区等头，接口声明上看不到这些头；目标端用 @ohos.net.http 自建 HttpClient，skill 参考模板示范 `Authorization: Bearer ${token}`；API 清单可能只给出拦截器路径和 header_write 一类标签。'
  unless: []
  why: '拦截器注入的头不出现在任何接口声明里，只看接口清单或规格就会漏；服务端可能把缺失的头当空串解析后报错（来源中缺 Platform-Type 时报 strconv.Atoi: parsing ""）。模板里的 Bearer 前缀是通用示例，源端可能直接放 token。来源中实现者手里只有清单里指向拦截器的 header_write 标签和模板，没打开拦截器源码，写出只含 Content-Type、X-Platform 的默认头，Authorization 还加了 Bearer 前缀。'
  how:
  - 写默认头之前打开清单里标为 header_write/token_injection 的拦截器源码，逐条对照 addHeader：头名、取值来源（token、系统语言、地区、平台常量）和格式。
  - 取源拦截器 addHeader 的键集合与目标默认 headers 的键集合做差集，差集非空就补齐，或在规格里写明不迁的原因。
  - 模板里的 `Bearer ${token}` 只当结构参考，Authorization 等头的格式以源码为准。
  evidence:
  - case: case-69bfbfee5841bf8c60cf
    claim: diagnosis
    revision: 1aa6e7e3971d70c0addd022dfb338c9a5888911f0725aaccb2d2079c9bc324a8
  - case: case-69bfbfee5841bf8c60cf
    claim: recommendation:3
    revision: 1aa6e7e3971d70c0addd022dfb338c9a5888911f0725aaccb2d2079c9bc324a8
  requires: []
  status: active
- title: 源端从响应头取 token/refreshToken 时，HTTP 封装把响应头交给调用方，Repository 按源端成功回调取值
  topic:
  - data
  - network
  when: 网络与登录数据层的规格提取和实现阶段，确定登录类接口凭证的取值来源与 HTTP 封装的返回结构时
  description: 源端 Retrofit 登录接口返回 Response<BaseResponse<T>>，Repository 在成功回调里用 headers()["Authorization"]、headers()["RefreshToken"] 写 TokenManager，body 的 data 只含用户信息；目标端 HTTP 封装统一返回解析后的响应体。
  unless: []
  why: 封装层只返回 body 时，响应头在最底层就被丢掉，上层怎么写都拿不到凭证；照“登录返回用户与 token”这类规格措辞去 body 里找，只能取到空值，refreshToken 也一直是空串，持久化和刷新随之失效。来源中规格从未写明凭证来源，封装层实现者只读到 body 结构；Repository 实现者跳过源码，只从 data 取 token，给保存函数传空串。
  how:
  - 规格整理鉴权模型时，列出返回 Response<BaseResponse<T>> 的端点，逐个查调用方是否读取 headers()，把头名和写入点写进网络层与登录功能规格。
  - 源接口有 Response<> 包裹的端点时，HTTP 封装把响应头随结果返回（例如在响应对象上加 header 字段）；读取时兼容头名大小写。
  - 实现登录 Repository 前读源 Repository 的成功回调，核对 token 与 refreshToken 各自来源；源端写了 refreshToken 时，不向保存函数传空串。
  evidence:
  - case: case-31852e28af4327a408a3
    claim: diagnosis
