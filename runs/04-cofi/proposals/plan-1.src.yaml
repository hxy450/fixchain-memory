  - id: lesson-e9c6e8ef1b29a6fe9c26
    title: "沿用已生成页面或兄弟任务的写法前，回到源码核对该片段的语义"
    topic: [process, spec-handoff]
    when: "页面转换、公共组件抽取、切片接线或页面重建阶段，参照已生成页面中的同名控件、弹窗、列表或顶栏写法时"
    description: "后写的 worker 同时读到源码与先前 agent 已生成的目标代码片段（@Builder 控件、输入弹窗、列表键函数、顶栏折叠等），准备当作项目约定直接沿用。"
    unless: []
