topic_descriptions:
  app: "应用级入口与横切约定：入口 Ability 的平台级守护与 skills 声明、日志写法、应用身份（显示名、包名厂商、版本号）、设置项与平台能力"
  app/entry: "入口 Ability（onCreate/onDestroy）需要补上的平台级守护，以及 module.json5 中入口 Ability 的 skills（深链）声明"
  app/identity: "应用身份字段从 Android 迁到 AppScope 与入口模块：显示名及其 label 资源、bundleName/vendor、版本号的读取"
  app/settings: "设置项迁移：偏好键与默认值之外，每个开关的运行期消费方与应用入口"
  app/platform: "系统平台能力（后台任务、通知、画中画回退、动态取色）的实现、替代与降级，以及后台计时的恢复和退出清理"
  ui: "界面迁移：布局与尺寸约束、主题样式、状态刷新、输入控件、图形资源、结果反馈与多页面导航（含返回键）的跨栈转换"
  ui/navigation: "多屏拆成多页面后的导航：目的地命名与参数、返回栈重建、返回键分发、挂载与生命周期归属"
  ui/state: "ArkUI V2 状态刷新与订阅：@Builder 参数、页面与共享模型的绑定、ForEach 键与子组件刷新、监听的注册与释放"
  ui/layout: "容器选择、约束与定位（ConstraintLayout、RelativeContainer、Column 等），尺寸约束（滚动容器定高、百分比尺寸），以及随滚动折叠的顶栏"
  ui/graphics: "图标与图形资源：动画矢量的状态帧、系统符号替代、资源迁移中的静态化标注"
  ui/feedback: "操作结果反馈：Snackbar 一类提示的宿主、时长与成功/失败态渲染"
  ui/text: "文本展示：源端对展示文本的加工（富文本、链接识别与点击）到 ArkUI Text/StyledString 的转换"
  data: "数据层：本地数据库的建表与版本迁移、预置数据播种、打包资源解析与持久化枚举映射"
  data/seeding: "预置（种子）数据的播种时机、主键写入与补充插入"
  data/schema: "Room 到 relationalStore 的库名、schema 版本、建表语句与升级路径"
  data/parsing: "打包 JSON 等资源的解析：字段必填与空值语义"
  data/model: "模型类型之间的映射：持久化枚举字符串与页面本地类型"
  process/input-loading: "写前输入是否真的进入上下文：必读 skill、规格、参考与源码片段的读取方式，以及编排者接手切片时要加载的输入"
  process/task-handoff: "跨任务移交：留给别的文件、切片或编排者兑现的工作如何登记、分派、接收与闭合，以及各类占位的使用边界"
  process/spec-handoff: "规格、已生成代码等二手输入与源码之间的交接：规格条目的写法、概括出错、照搬前核对与冲突回报"
