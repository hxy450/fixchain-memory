  - title: "“不确定”“待补资源”“延期”这类占位只登记输入确实缺值的情况；源码已写明、能实现的行为当场实现"
    topic: [process, task-handoff]
    when: "页面转换阶段决定是否登记 forward-ref-uncertain、resource-pending-asset 等占位，以及收口或验收阶段把这些占位改成 deferred 时"
    description: "工程提供多种占位类型（不确定值、待补资源、延期），页面规格置信度为 medium 或同名资源看似存在；源码和规格其实已给出行为或所需图形。"
    unless:
      - "缺的确实是输入里没有的值，例如合成快照缺少尺寸、资源映射表里没有对应资产"
    why: "占位把能实现的工作挂成债务，后续阶段看到“已登记”就放过，直到验收门把 deferred 判成阻塞。来源两例：顶栏连续折叠在源码里写明，陷阱表也给了做法，转换者因页面置信度 medium 登记“不确定”；动画图标的资产存在，缺的是按状态选帧，转换者挂成“待补资源”。收口阶段两次改 resolve_by、标 deferred，都没有回看源码。"
    how:
      - "登记前判断：缺的是输入里的值，还是实现工作？后者当场实现；确实做不到，在报告里写明缺哪一项（哪一帧、哪个值）。"
      - "页面置信度 medium 不要求产出不确定标记；引用陷阱表条目时核对它给的修法与自己的实现一致。"
      - "收口或验收阶段处理这类条目时先回看条目指向的源码；能实现就实现，只有确需真机数据时才改为 deferred。"
    evidence:
      - {case: case-66f3c1649b7b5c4f38b5, claim: "recommendation:3"}
      - {case: case-66f3c1649b7b5c4f38b5, claim: "recommendation:4"}
      - {case: case-753b41488ff67ec1d068, claim: diagnosis}
      - {case: case-753b41488ff67ec1d068, claim: "recommendation:3"}
    requires: []
    status: active

  - id: lesson-7a065e8fe384b8c462cc
    title: "规格写法与写前读到的源码、主题或映射参考冲突或遗漏时，按源端语义实现并标注差异"
    topic: [process, spec-handoff]
    when: "页面或数据层实现阶段，规格给出的容器、样式、类型写法或验收条目与写前读到的源码、主题或映射参考不一致，或验收条目没有列出源码里可见的行为时"
    description: "实现者同时读到规格与源布局、源码、主题文件、映射参考或 SDK 声明，规格的具体写法（含验收条目里的列表范围、过滤条件）与源端可观察行为或参考映射不符，或验收条目漏掉了源码对展示内容的加工；规格对该处只有概括性理由或没有提及。"
    unless:
      - "规格或决策记录（如 decision ledger）对该差异写明了有意取舍的理由，此时按该决策实现"
    why: "规格是对源端的概括，可能把语义写错或写漏；实现者以“按规格”“验收项没列”为由保留差异，偏差就原样进入代码，直到编译门、视觉比对或评审才暴露。来源跨两个应用：三例中实现者写前都读到了与规格相左的输入（映射参考 ConstraintLayout → RelativeContainer、主题紫色与已迁移色令牌、类型映射 String → String），最后照抄了规格；另一应用里规格作者因读取截断把“对话框列出全部默认项”写成“只列数据库里缺失的”，实现者写前已读到源码按全部列出，仍按规格过滤；还有转换者读到描述文本经链接识别函数加工后再显示，推理写明“验收项只要求折叠，可以做成纯文本”，就把链接删了。"
    how:
      - "写码前对冲突点逐一取舍：规格只有概括性理由时，以源端可观察行为为准实现；涉及 API 签名的，以本地 SDK 声明为准。验收条目标注了源码出处时，打开该出处核对。"
      - "源码里有、验收条目没写的可见行为，不能据此判定可删：按源码实现；做不了就登记占位，并在报告未决项里写明降级。"
      - "在转换或迁移报告里列出与规格不同的每一处及依据，供规格阶段回改；不要为了与规格一致而删掉已确认的源端语义。"
    check: []
    evidence:
