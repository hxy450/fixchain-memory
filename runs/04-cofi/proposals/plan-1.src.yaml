  - title: "解决前向占位时按登记的触发文本逐项兑现：只接一半、写成常量或删掉标记都不算闭合"
    topic: [process, task-handoff]
    when: "切片实现或接线阶段，把页面转换留下的前向占位（FWD-REF）替换成实现并删除标记时"
    description: "页面转换阶段按“只输出 UI”约束留下前向占位，登记表写有触发文本，例如“持久化并触发主题立即切换”“切换步骤时重触觉”“由服务提供版本号”“通知授权由平台服务实现”，由后续切片或接手者实现。"
    unless: []
    why: "标记删掉后编译和结构审计都会通过，触发文本里没做的那一半没有任何门会发现。来源四类：只接了偏好持久化、没有运行期消费方；只重置进度、没做反馈；把应由服务提供的版本号写成与配置文件重复的常量；把应真实现的平台能力写成恒定返回值。"
    how:
      - "删标记前把触发文本拆成动作清单（持久化、运行期消费方、反馈、值来源、导航），每一项都能在代码里指出实现位置后再删。"
      - "触发文本要求服务或 ViewModel 提供值时，写入常量或复制配置文件里的值不算闭合，改为从运行时来源读取。"
      - "删除标记后 grep 同一函数：恒定返回（return false、两支相同的三元表达式）、与配置文件相同的字面量，都是没闭合的信号。"
    evidence:
      - {case: case-470d704a6ec794b4c3c9, claim: diagnosis}
      - {case: case-470d704a6ec794b4c3c9, claim: "recommendation:1"}
      - {case: case-290eac71ee43fe336138, claim: "recommendation:1"}
      - {case: case-f935850c669c48f05a00, claim: "recommendation:4"}
      - {case: case-f93a2f80bafd58105489, claim: "recommendation:3"}
      - {case: case-f93a2f80bafd58105489, claim: "recommendation:4"}
    requires: []
    status: active

  - id: lesson-4f81eeea17b94190c2de
    title: "要靠其他文件或任务补实现的功能，登记成带负责方、验证方式和源端确定值的移交项，不只写在注释或动作摘要里"
    topic: [process, task-handoff]
    when: "页面转换、切片实现或接线阶段，本文件的功能需要别的文件补调用点、或要由后续步骤补值才完整时（包括留下前向引用），以及读到上游留给本文件的移交说明时"
    description: "写码者确认某项行为在当前文件里无法闭合（例如非入口组件的平台回调要由入口页转发、宿主回调留给接线切片、脚手架身份值留给后续步骤），工程提供了移交登记约定（如带 owner/what/verify 的 HANDOFF 标记、前向引用登记表、返回信封中的字段）；或接线者在上游文件头读到要求本文件转发的说明。"
    unless: []
    why: "文件头注释和报告里的开放问题不进入任何检查：编译、结构审计都会放行，后续编排与复核也容易按“已处理”理解；登记只写动作摘要时，写前已读到的源端细节在交接中丢失，接手者只能猜。来源中页面转换者已从 SDK 注释核到平台限制，也起草了指向壳页切片的移交，落盘时删掉，只留文件头说明；资源任务在返回里只写“归属后续步骤”；另一应用里转换者读到了更新卡的确切网址、克隆名的本地化后缀和“以编辑草稿为克隆内容”，登记只写“更新卡外链”“复制并重建列表栈”，接手者没读源码，写了猜测的网址和按持久化数据、原名克隆。"
    how:
      - "按工程的移交约定登记：写明负责方（具体切片或阶段）、要补什么、如何验证；验证断言难写时改用切片级断言（如 slice:N），移交本身保留。"
      - "登记里写入已读到的源端确定值与出处：网址、常量、比较符、参数来源（持久化值还是编辑草稿）、字段变换、完成后的导航；只写动作摘要不够。"
      - "按分工保留应由别人处理的值时，在返回里逐项列出保留的键或片段，以及应接手的步骤。"
      - "接线时读到上游文件要求本文件转发或补调用点，就在本文件实现；派工不允许或实现不了时作为阻塞项上报。接手者从登记里取不到确切值时，打开出处源码取值，取不到就登记缺口，不写推测值。"
      - "派工只允许写本文件、而源端依赖的共享工具还没有目标文件时，在本文件实现等价逻辑，或登记前向引用交给后续切片；不要静默省略。"
    check: []
    evidence:
      - {case: case-2b9869554cf9027174a0, claim: diagnosis, revision: "7a8b6c38a3c18e891b947aa5b7033c3e97f07cc223e7c124744f4c8558070714"}
