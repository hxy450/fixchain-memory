upsert:
- title: ArkTS 里给对象字面量写显式 class/interface 类型；去掉 Record 时键已知用具名字段类、键不定用 Map，不改成索引签名
  topic:
  - arkts
  - strict-mode
  when: 编码或返修阶段，为一组命名常量、主题令牌或键值集合确定类型声明，或按规范替换 Record/Object 时
  description: 代码用对象字面量承载间距、圆角等令牌，或用键值集合保存偏好、设置；目标文件可能还没被页面或 Ability 导入，或者并发 worker 被要求不跑全量构建，编译器暂时检查不到这些写法。
  unless: []
  why: 'ArkTS 严格模式不接受无类型对象字面量（arkts-no-untyped-obj-literals），也禁止 [key: string] 索引签名（arkts-no-indexed-signatures）；没被任何页面或 Ability 导入的文件不进入全量编译，错误会潜伏到第一次接线时才暴露。来源中编排者照搬 skill 里 static readonly X = {…} 的无类型示例写主题令牌，因为没有文件导入它，终态编译照样通过；返修 worker 按“禁用 Record”把类型改成索引签名，两人都怀疑过是否受支持但没验证，汇总构建时报出一批编译错误。'
  how:
  - '新建令牌或常量类时给每个对象字面量一个具名 class 或 interface 类型（如 class ThemeSpacing { small: number = 4 }），不照搬无类型示例。'
  - '替换 Record 时，键集合已知就改成具名字段类，键不固定就用 Map；不要写成 [key: string]: T。'
  - 新建但尚未被导入的 .ets 文件，落盘后临时接一处导入或单独跑一次 ArkTS 检查，再据构建结果报告通过。
  evidence:
  - case: case-98e7bd27bb334db83f51
    claim: diagnosis
    revision: e3b34e5cf0141bbd33b2ff873f7e69123a2b872c4526854af2ba0acb5724774e
  - case: case-98e7bd27bb334db83f51
    claim: recommendation:1
    revision: e3b34e5cf0141bbd33b2ff873f7e69123a2b872c4526854af2ba0acb5724774e
  - case: case-98e7bd27bb334db83f51
    claim: recommendation:2
    revision: e3b34e5cf0141bbd33b2ff873f7e69123a2b872c4526854af2ba0acb5724774e
  - case: case-98e7bd27bb334db83f51
    claim: recommendation:3
    revision: e3b34e5cf0141bbd33b2ff873f7e69123a2b872c4526854af2ba0acb5724774e
  requires: []
  status: active
- title: 派工转述编码禁令时连同原文里的替代写法一起下发；禁止并发构建的 worker 改动，汇总后立即全量构建
  topic:
  - process
  - task-handoff
  when: 编排或返修阶段，把规则清单转述进 worker 派工，并决定 worker 能否自行构建时
  description: 编排者收到的规则原文带有替代写法（例如“禁止 Record，改用具名字段或 HashMap”），派给多个并发 worker 时压缩成一句禁令，并要求 worker 不跑全量构建。
  unless: []
  why: 只转述禁令不转述替代写法，worker 会各自找一种看似合规的写法，可能同样被禁止；又因为不能构建，错误要到汇总后才暴露。来源中返修派工把“No Record<K,V> — use explicit typed fields or HashMap”截成“No Record<K,V>”，两个 worker 都改成了索引签名。
  how:
  - 转述规则时保留原文的替代写法或示例，不只写禁令。
  - 禁止 worker 并发构建时，收齐改动后立即全量构建，并逐一核对 worker 新引入的类型声明。
  evidence:
  - case: case-98e7bd27bb334db83f51
    claim: diagnosis
    revision: e3b34e5cf0141bbd33b2ff873f7e69123a2b872c4526854af2ba0acb5724774e
  - case: case-98e7bd27bb334db83f51
    claim: recommendation:4
    revision: e3b34e5cf0141bbd33b2ff873f7e69123a2b872c4526854af2ba0acb5724774e
  requires: []
  status: active
- id: lesson-c6132bf52c26ec226788
  title: 入口 Ability 注册全局未捕获异常观察器，Android 源里没有对应代码也要补
  topic:
  - app
  - entry
  when: 入口装配阶段，改写 EntryAbility（或 AbilityStage）的 onCreate/onDestroy 并决定入口需要哪些平台级守护时
  description: 目标为 HarmonyOS Stage 模型应用，入口 UIAbility 由模板改写而来；Android 源没有可对照的全局异常处理，按源码迁移不会产生这段代码，而验收（如 ECAT crash_risk 规则）要求存在全局异常观察。
  unless:
  - 工程已在 AbilityStage 或其他入口注册了 errorManager 观察器或等效的崩溃监听
  why: 未捕获异常会直接终止进程，没有观察器时应用侧不留记录。这是目标平台上的约束，源端没有对应物；迁移契约只按源码和入口导航要求改写入口，就会缺这一项。来源两个应用都如此：入口装配参考、迁移期静态检查表、决策账本和规格都没有提出，直到 ECAT 判官才要求，属于新要求而非写码者偏离输入。
  how:
  - 在入口 onCreate 中用 errorManager.on('error', observer) 注册观察器，onUnhandledException/onException 中至少用 hilog 记录错误；保存返回的 observerId，在 onDestroy 中调用 errorManager.off('error', observerId)。
  - 写完 rg -n "errorManager\.on\(" entry/src/main/ets，确认至少命中一处且位于入口 onCreate，同文件 onDestroy 有对应的 off。
  check: []
  evidence:
  - case: case-0c59c27ee4ceac59cb60
    claim: diagnosis
    revision: ef78d0386ff978a885a66b8eb4748a1f01dafdbe0ffad7729f8a8fc262809384
