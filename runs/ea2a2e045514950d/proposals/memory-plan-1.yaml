retire: []
topic_descriptions:
  ui: 界面迁移：布局与尺寸约束、安全区、主题样式、状态刷新、输入控件、点击命中与控件行为、弹窗、分页与列表、图形资源、结果反馈、Web 页承载与多页面导航（含返回键）的跨栈转换
  ui/web: Web 组件承载 H5：加载错误回调的范围与整页失败态，宿主原生标题栏与 H5 自带导航栏按页面状态的显隐
  ui/interaction: 点击命中与遮罩：Stack 叠层的 hitTestBehavior、页面级全屏遮罩的挂载方式、覆盖层对下层控件点击的影响、点击事件挂在哪一层节点，以及控件点击处理器副作用（音效、振动、持久化、面板）的迁移
  ui/graphics: 图标与图形资源：动画矢量的状态帧、系统符号替代、资源迁移中的静态化标注，图标固有尺寸与 scaleType，整屏背景图的缩放方式，自绘图表的坐标原点，按使用场景区分的资源变体映射
  ui/theme: 主题、语义色、控件默认样式与 style 继承属性（圆角、高度、渐变、字号）的迁移，被引用 drawable 的取值，颜色约束的写法，以及按色值选择颜色资源
  ui/list: 列表与宫格：分页加载的并发门闩与刷新互斥，多列 Grid 中占位与跨列项的排布，列表项主副行与空值回退，多组列表的数据源绑定与级联选择
  ui/input: 输入控件：源端输入约束到 TextInput 等组件属性的转换（含小数输入），格子式密码输入层与获焦，自定义控件 XML 属性的初值
  ui/feedback: 操作结果反馈：异步结果各分支的提示与去向，Snackbar 一类提示的宿主与渲染，校验失败提示的承载与可见性，多入口 loading 的起链与收口，降级方案的成功引导
  ui/dialog: 弹窗与半模态：V2 页面可用的弹窗载体、sheet 内二级弹窗的层级、按源 Dialog 类型选择呈现形态（路由约束不改变弹窗形态）、弹窗内二级选择器的层级、按源布局还原弹窗内容
  ui/safearea: 沉浸式安全区：避让区测量与 px/vp 换算（状态栏、导航指示条），系统栏图标深浅，路由页内容原点与顶部 inset 的消费位置，全屏页底部按钮、按键区与贴底弹层的避让及承载层，逐页落实前景避让
  ui/layout: 容器选择、约束与定位（ConstraintLayout、RelativeContainer、Column 等），默认对齐差异、百分比尺寸与 margin、并排 wrap_content 列的宽度分配、跟随等高、滚动容器的包含范围、运行时挂载层与锚点转换、随滚动折叠的顶栏、全屏底层与状态覆盖层骨架、gone 节点与列表 item 布局，以及视觉修复中固定尺寸的依据
  app/startup: 冷启动链路：闪屏路由、各去向页的初始化请求、登录态组合在哪里处理、首屏等待异步装配完成的就绪门，首启尚无已选项时的状态，以及加载页的可见时长
  data/network: 网络层：服务地址与环境、URL 拼接、拦截器注入的公共请求头、请求体字段、登录凭证来源与失效踢登，以及网关加密传输到 cryptoFramework 的移植
  data/model: 模型类型之间的映射：持久化枚举字符串与页面本地类型，大整数 id（源端 Long 或 String 承接）的保精度解析，跨模型数值字段的单位，保存与查询的关联键（如按月份）
  data/seeding: 预置、演示与参考数据：内容逐字段取自源端种子类或 assets 数据文件，播种时机（建库回调或首次启动标记）与重置入口，主键写入与补充插入
  process/spec-handoff: 规格、已生成代码等二手输入与源码之间的交接：规格条目的写法（含增量对齐时点击入口的导航契约）、上游产物缺值时如何收口、概括出错、照搬前核对与冲突回报（含对齐既有页面骨架），多模块同名布局的解析，合成快照清单的可信度
  process/build: 编译修复循环与构建结果判定：只改报错定位处、不以删功能换取通过、整文件重写时保留未报错写法，读全错误输出，失败构建不以警告或部分通过放行，最终结论只引用晚于最后改动的构建
