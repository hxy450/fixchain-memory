  why: 宿主级 expandSafeArea 不代表子页面也从窗口顶部排布；来源工程实测路由页节点从状态栏下沿开始。按“页面从窗口顶起算”处理会把 Android 顶距整段叠在 inset 之下形成空白，在未扩展的根上再加 padding(topInset) 会多出一条色带，背景不扩展又露出状态栏区。来源中四个页面分别出现这三类偏差，其中执行者已读到兄弟页注释“导航已消费 inset”仍重复叠加。
