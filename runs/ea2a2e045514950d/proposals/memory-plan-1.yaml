  - web
  when: WebView 页面实现阶段，为 Web 组件的加载错误回调决定是否切换整页失败/重试状态时
  description: 目标页用 Web 组件加载线上第三方 H5，自带加载进度与覆盖 Web 区域的失败重试卡片，在 onErrorReceive 中处理加载错误；参考模板可能把该回调写成无参形式。
  unless: []
  why: onErrorReceive 同时报告主文档与图片、脚本等子资源的加载错误；直接绑定整页失败态，页面已渲染时任一子资源失败也会用失败卡覆盖正常内容。来源中写者照技能模板写了无参回调并在其中置失败态，真机上已显示的 H5 表单被“加载失败”覆盖；修复加 event.request.isMainFrame() 判断。
