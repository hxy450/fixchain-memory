  why: 路由页会带来独立页面栈、伪造的遮罩和不同的关闭方式；路由约束管的是页面间跳转，不决定弹窗形态。来源中规格作者正确记录了“全宽底部弹窗”，却援引路由决策写成“用路由页承载等价弹层”，执行者据此把记账面板做成路由页并以半透明色块伪装遮罩；规格明确要求的日历弹层又被插进 layoutWeight 内容列，被键盘面板挤压；用户多轮反馈后才改为宿主页内顶层叠层与半屏日历。
