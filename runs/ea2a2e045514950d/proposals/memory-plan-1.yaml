  when: 验证阶段核对功能完成度，或实现、返修后向用户报告“已实现/已对齐”时
  description: '验证检查只 grep TODO: 与占位登记表；实现者或返修者按功能点列对齐表并逐项打 ✅；规格写有验收条目、页面导航出口与启动触发条件。'
  unless: []
  why: 文本检索只能发现写了标记的占位，发现不了缺失的处理函数、只写注释的回调或没有调用者的函数；对齐表按意图打勾，未实现项就以“已完成”交付，直到用户操作时才暴露。来源中待办勾选、点击跳转、首次启动播种都被报告为已实现或完全一致，代码里却没有对应组件、跳转调用或启动路径调用。另一应用中首页横幅与四张资讯图的点击处理只含 FWD-REF 注释与 return，规格确认消息仍向用户称已对齐点击语义。
