  why: 把源码里已确定的目标抽象成“打开对应业务页”，再以 pending/forward-ref 作为可验收结果，交付的入口就是空点击；没有后续切片兑现时，这些占位要等用户操作才暴露。来源中规格作者写前读全了首页 Fragment：横幅打开固定的火车票 H5、四张图各进详情页，规格却只写“进入对应业务”、验收允许 forward-ref，计划要求找不到目标就登记，worker 照此写出只含 FWD-REF 的空方法；两个目标页都是小页面，修复几分钟完成。
