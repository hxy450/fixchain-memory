- title: 把 RSA-OAEP + AES-GCM 网关加密移植到 cryptoFramework：生成器规格串只写算法与位数、加解密结果判空、Buffer 不套 Node 视图
  topic:
  - data
  - network
  when: 网络基础设施实现阶段，把 Android 端 RSA-OAEP 包裹会话密钥加 AES-GCM 加密的网关传输改写为 ArkTS cryptoFramework 与 buffer 调用时（含为通过编译改写同步 API 与类型的收敛步骤）
  description: 源端用 X509EncodedKeySpec 解析“BEGIN PUBLIC KEY”PEM，以 RSA/ECB/OAEPWithSHA-256AndMGF1Padding 包裹随机密钥，用 AES/GCM/NoPadding 加密可能为空的请求体并解密响应；目标用 createAsyKeyGenerator/convertPemKeySync、Cipher.updateSync/doFinalSync 与 @kit.ArkTS buffer 实现同一协议。
  unless: []
  why: 协议理解正确不等于 API 映射正确：生成器规格串附加 PKCS1 后缀会拒绝 X.509 公钥；GCM 空明文加密与解密 final 可能返回 null；Node 式 .buffer/byteOffset 视图在 ArkTS Buffer 上不可靠。来源中这三处都在编译通过后于真机失败（生成器创建失败、读取 null 的 data、newByteLength 越界），其中判空兜底是为通过编译改用同步 API 时按 d.ts 非空签名删掉的。
  how:
  - createAsyKeyGenerator 只写算法与按实际公钥得出的位数（如 'RSA2048'），X.509 PEM 直接交给 convertPemKeySync，不附加 PKCS1 等编码后缀。
  - Cipher.update/updateSync 与 doFinal/doFinalSync 的结果一律判空后再取 data，即使 d.ts 签名是非空 DataBlob；为通过编译改写同步 API 时保留原有兜底。
  - 需要独立 Uint8Array 时按 length 分配并拷贝，不用 new Uint8Array(buf.buffer, buf.byteOffset, …)；编译报 Buffer 属性不存在时先查 ArkTS buffer 语义，不做字段名机械替换。
  evidence:
  - case: case-c5fdc6640404c3d6440e
    claim: diagnosis
    revision: 57224d21a8e649b2e4b9f92790135d47094a8dff2b22347228afd0dc58c86165
