  description: 后写的 worker 同时读到源码与先前 agent 已生成的目标代码片段（@Builder 控件、输入弹窗、弹窗承载方式、列表键函数、顶栏折叠、图标控件行、安全控件样式、全屏遮罩、onReady 取栈写法、共享状态 key、登录结果解析函数等），准备当作项目约定直接沿用。或对齐任务在一个与源端结构不同的既有页面上进行，写者已读到源布局 XML。
  unless: []
  why: 已生成片段可能带着偏差，照搬会把它复制到新文件，形成多处同源缺陷。来源跨多个应用：公共组件逐字沿用页面里的 @Builder 值参写法与输入框 onChange 限长，列表页重建沿用只含 id 的 ForEach 键；另一应用里两位设置页转换者都读到了源端连续折叠顶栏的写法，前一位沿用兄弟页的两态近似并称之为项目约定，后一位把前一位的输出当作“约定锚点”再抄一次；第三个应用里写者读到源端新登录方法从响应头取凭证，仍复用了已有的按响应体解析的函数，把同一偏差扩到新方法。写者都读过源码，却以已有代码为准。第四个应用里多处沿用：个人资料页照抄周铃页把 V2 组件交给 CustomDialogController 的写法并推断“builder 接受任意组件”，本地播放页照抄网络播放页满盒 Contain 的图标行，多个页面沿用透明底 SaveButton 的“范式”，修复时又以“壁纸页同款”接受了授权窗口风险。第五个应用里，Tab 子页转换者照搬压栈页在 onReady 取 context.pathStack 的写法，页面嵌入 Swiper 后点击失效或崩溃；多个写者把工程里已有的连字符共享状态 key 当作命名约定继续使用。这些先例本身都没有经过运行验证。第六个应用里，写者已读全账本详情页 XML（背景图、统计卡、预算圆环、流水/日历页签），仍保留基线页面的渐变头、“账单数量”“最近账单”等源端不存在的区块，只改高度与边距；附近页执行者也保留了基线自创的渐变头部，没有按规格改成白色标题区。
  how:
