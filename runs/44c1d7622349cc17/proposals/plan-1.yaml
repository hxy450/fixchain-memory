- title: 源端默认起始对齐和贴顶要显式写出：ArkUI Column 交叉轴默认居中，Scroll 内不满一屏的内容默认居中
  topic:
  - ui
  - layout
  when: 界面实现阶段，把纵向 LinearLayout、带 constraintStart/Top 的 ConstraintLayout 或 ScrollView/NestedScrollView 转成 ArkUI Column 与 Scroll 时
  description: 源纵向 LinearLayout 没写 gravity（子项默认贴起始边），或 wrap_content 子项以 constraintStart_toStartOf=parent 靠起始边、卡片以 constraintTop_toTopOf=parent 贴顶；目标 Column 宽度撑满，子项为固定或内容宽度；滚动页内容常不满一屏。
  unless: []
  why: ArkUI Column 的交叉轴默认是 Center，把源端“没写 gravity”照搬成“不写 alignItems”，返回键、标题、列表行就会被居中；父 Stack 的 alignContent 只放置 Column 本身，不影响其子项。Scroll 对不满一屏的内容也会纵向居中，而 NestedScrollView 是顶锚。来源中写者在源端本来居中的空态上显式写了 Center，却在源端默认对齐处什么都没写。
  how:
  - 源端默认起始对齐时，对应 Column 显式写 alignItems(HorizontalAlign.Start)（或给子项 alignSelf）；只有源端写了 center/center_horizontal 才用 Center。
