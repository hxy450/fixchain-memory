- title: 播放器面等运行时 addView 挂到根部的层，按运行时层级实现，不按 XML 里的占位区域定几何
  topic:
  - ui
  - layout
  when: 界面实现阶段，转换含运行时挂载子视图（播放器面等）的列表项或页面、确定视频层与浮层关系时
  description: 源 Fragment/Adapter 在播放时通过 addView/LayoutParams 把视图挂到根容器（如 addView(videoView, 0) 无约束铺满），XML 里同名区域只是封面或控制视图；目标用 Stack/Column 重建层级。
  unless: []
  why: 只看 XML 会把封面/控制区当成视频区，把视频夹在标题行与按钮行之间；运行时视频其实铺满、标题与按钮浮在其上。来源中写者读到了 addView 调用，仍按 XML 区域写，视频区结构性偏小、标题错位。
  how:
  - 先在 Fragment/Adapter 中查 addView/removeView/LayoutParams，确认运行时视图挂在哪一层、有无约束，再定层级：无约束挂到根部的，放在根 Stack 最底层铺满；XML 占位区只保留封面与播放态显隐。
  evidence:
  - case: case-c85d8667f78c2cc8f53a
    claim: diagnosis
    revision: 79c3cac8d22f9758074aa2d442825b0df09773593d0f4118f1b88d1f9b29b330
