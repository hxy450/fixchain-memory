- title: 源端访问解包后对象的字段时，先确定目标 res.data 对应哪一层类型，再逐层写取值键
  topic:
  - data
  - parsing
  when: 数据层服务实现阶段，把源端 Retrofit/Gson 响应 Bean 的字段访问路径翻译成目标端对原始 JSON 的逐键取值时
  description: 源端 success 回调已把 BaseResponse<T> 解包成 T，业务代码写 result.data?.xxx；T 本身是含 data 字段的容器 Bean（如 {total, data:{…}}）；目标网络层把响应 data 原样返回，服务层用 getObject/getArray 按键手动取值。
  unless: []
  why: 源端表达式里的 result 已是解包后的容器对象，它的 .data 是容器内层；目标 res.data 指向容器对象本身。照抄表面路径 res.data.xxx 会少取一层，取值落空时常回落为空数组或默认值而不报错，页面表现为既无数据也无空态。来源中写者读到了 Bean 定义并在笔记里复述了两层结构，同一服务的其他端点也正确取了内层，只有这一端点照抄了源端路径。
  how:
  - 写取值前先写出“目标 res.data = 源端哪一个类型”，再按该类型的字段链逐层取值：容器 Bean 含内层 data 时，先 getObject(res.data, 'data') 再取内层字段。
  - 同一服务写完多个容器端点后，逐个列出“目标取值键链 ↔ Bean 字段链”，确认层数一致。
  check:
  - 决定后续页面是否创建的解析结果（如分类 Tab）用一次真实响应或样例确认非空，并区分“服务端返回空”与“取值路径未命中”。
  evidence:
  - case: case-18365c67d94d72d8a825
    claim: diagnosis
    revision: 9015604c12e01a3cee6b3f7cd1cc198b079e1aa1283ab1e87ae404f490e406d8
