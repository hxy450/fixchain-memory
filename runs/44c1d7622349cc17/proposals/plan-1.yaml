topic_descriptions:
  ui: 界面迁移：布局与尺寸约束、安全区、主题样式、状态刷新、输入控件、点击命中、弹窗、分页与列表、图形资源、结果反馈与多页面导航（含返回键）的跨栈转换
  ui/layout: 容器选择、约束与定位（ConstraintLayout、RelativeContainer、Column 等），默认对齐差异、百分比尺寸与 margin、跟随等高、运行时挂载层与锚点转换，以及随滚动折叠的顶栏
  ui/safearea: 沉浸式安全区：避让区测量（状态栏、导航指示条），全屏页底部按钮与贴底弹层的避让
  ui/dialog: 弹窗与半模态：V2 页面可用的弹窗载体、sheet 内二级弹窗的层级、按源 Dialog 类型选择呈现形态、按源布局还原弹窗内容
  ui/interaction: 点击命中与遮罩：Stack 叠层的 hitTestBehavior、页面级全屏遮罩的挂载方式、覆盖层对下层控件点击的影响
  ui/pager: 分页与标签容器：ViewPager/ViewPager2 到 Swiper 的页数与手势、初始页定位、自绘 tab 与分页的双向联动
  ui/list: 列表与宫格：分页加载的并发门闩与刷新互斥，多列 Grid 中占位与跨列项的排布
  ui/state: ArkUI V2 状态刷新与订阅：@Builder 参数、页面与共享模型的绑定、ForEach 键与子组件刷新、监听的注册与释放、乐观更新与访问器兜底
  ui/input: 输入控件：源端输入约束到 TextInput 等组件属性的转换，格子式密码输入层与获焦，自定义控件 XML 属性的初值
  ui/feedback: 操作结果反馈：异步结果各分支的提示与去向，Snackbar 一类提示的宿主与渲染，多入口 loading 的起链与收口，降级方案的成功引导
  ui/navigation: 多屏拆成多页面后的导航：目的地命名与参数、返回栈重建、同一结果的单一导航出口、跳转参数与跳转前的状态交接、返回键分发、挂载与生命周期归属
  ui/graphics: 图标与图形资源：动画矢量的状态帧、系统符号替代、资源迁移中的静态化标注，图标固有尺寸与 scaleType
  ui/theme: 主题、语义色、控件默认样式与 style 继承属性（圆角、高度、渐变）的迁移，以及颜色约束的写法
  app: 应用级入口与横切约定：入口 Ability 的初始化、平台级守护与 skills 声明，冷启动链路，Flutter 混合工程的原生桥接，日志写法、应用身份、设置项、平台能力与媒体保存/导入
  app/media: 媒体与文件的用户可见性：SaveButton 安全控件的样式与授权时序、picker 导入导出、沙箱产物的导出、本地文件的播放 URI
  data: 数据层：网络请求与鉴权、本地数据库的建表与版本迁移、预置数据播种、JSON 解析（资源与接口响应层级）、模型类型映射（含 64 位整数与字段单位）、文件系统操作
  data/parsing: JSON 解析：打包资源的字段必填与空值语义，接口响应容器 Bean 的取值层级
  data/model: 模型类型之间的映射：持久化枚举字符串与页面本地类型，大整数 id（源端 Long 或 String 承接）的保精度解析，跨模型数值字段的单位
  data/files: 文件系统操作：fileIo 建目录、移动与复制在目标已存在时的行为与幂等写法
  process/input-loading: 写前输入是否真的进入上下文：必读 skill、规格、参考与源码片段的读取方式，派工要求的源码核对，辅助谓词与 getter 的定义，以及编排者接手切片时要加载的输入
