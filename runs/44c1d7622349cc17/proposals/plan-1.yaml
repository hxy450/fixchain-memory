- title: ConstraintLayout 改写成 Column 顺序流前先列出各子项锚点：锚父底、锚兄弟与双 0dp 比例子项都要保留语义
  topic:
  - ui
  - layout
  when: 界面实现阶段，把 ConstraintLayout 转成 Column/Row 顺序流或 Stack 层级，确定锚点边距与比例子项尺寸时
  description: 源 ConstraintLayout 中有多个子项 constraintBottom_toBottomOf=parent（含 invisible 仍占位的行）、按钮上方的文字以 constraintBottom_toTopOf 锚在兄弟上、0dp×0dp 加 dimensionRatio 的子项夹在上下锚点之间；目标用 Column 顺序流、layoutWeight、Visibility.Hidden 或父 Stack 的 BottomStart。
  unless: []
  why: 顺序流里的 margin 相对前后兄弟，照抄锚父底的 margin 会叠在后续占位兄弟之上（偏高一个兄弟高度）；把锚兄弟简化成父容器底部对齐会压到兄弟上；双 0dp 比例子项的边长是 min(可用宽, 可用高)，只写 width('100%').aspectRatio(1) 在高度受限时会溢出。写者往往在思考中复述了这些约束，写码时仍按顺序堆叠。
  how:
  - 转换前列出每个子项的锚点；多个子项锚父底时，用 Stack/RelativeContainer 按原 margin 贴底，或扣除后续流式兄弟的占位高度重算 margin。
  - 锚在兄弟上方的元素，底距 = 兄弟高度 + 其 padding + 自身 margin，不简化成父容器底部对齐。
  - 双 0dp 加 dimensionRatio 的子项按 min(可用宽, 可用高) 定边长：高度受限时写 height('100%').aspectRatio(r) 并限制宽度，源里的上下 margin 放到承担 layoutWeight 的容器上。
  - 注释里列出的尺寸与边距逐项对照实际修饰链，注释有而代码没有的按缺失处理。
  check:
  - dumpLayout 核对比例子项不超出其容器、锚底子项到内容层底的距离等于源 margin。
