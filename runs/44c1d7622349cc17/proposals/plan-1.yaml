- title: SaveButton 的底色与圆角设在控件自身，不设透明底再靠外层容器画外观
  topic:
  - app
  - media
  when: 界面实现阶段，用 SaveButton 等安全控件替代源端自绘样式按钮（渐变、半透明胶囊、圆角描边）时
