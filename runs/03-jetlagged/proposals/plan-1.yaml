topic_descriptions:
  app: "应用级入口与横切约定：入口 Ability 的平台级守护、日志写法、应用身份（显示名等）"
  app/identity: "应用身份字段（显示名及其 label 资源）从 Android 迁到 AppScope 与入口模块的写法"
  process: "迁移流程中的阶段交接与写前输入：规格与二手产物的核对、必读材料是否读全、跨任务移交的登记与兑现"
  process/task-handoff: "跨任务移交：留给别的文件、切片或编排者兑现的工作如何登记、分派与接收"
  ui: "界面迁移：布局与尺寸约束、主题样式、状态刷新、输入控件与多页面导航（含返回键）的跨栈转换"
  ui/layout: "容器选择、约束与定位（ConstraintLayout、RelativeContainer、Column 等），以及尺寸约束：滚动容器定高、百分比尺寸的解析"
  ui/navigation: "多屏拆成多页面后的导航挂载与生命周期归属（资源清理、返回刷新、返回键拦截）"
