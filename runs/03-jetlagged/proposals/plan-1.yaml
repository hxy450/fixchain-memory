upsert:
  - title: "落地应用显示名时同时改 AppScope 的 app_name 与入口 Ability 的 label 字符串，值取 Android 的应用名"
    topic: [app, identity]
    when: "执行编排阶段的应用身份落地步骤（资源迁移之后、页面转换之前），或资源迁移任务重写 string.json 时"
    description: "目标工程由脚手架生成，AppScope/app.json5 的 label 与 entry 模块 module.json5 中入口 Ability 的 label 都指向 $string 资源，值仍是脚手架工程名；Android 应用名来自 strings.xml 的 app_name，并由 Manifest 的 android:label 引用。"
    unless:
      - "本条只处理显示名；bundleName、vendor 等部署身份字段按工程已记录的决策处理"
    why: "显示名有两个入口：应用级 label 读 AppScope 资源里的 app_name，入口 Ability 的 label 读 entry 模块资源里的另一个键（脚手架默认 EntryAbility_label）。只改其中一处，另一处显示的仍是脚手架名，编译与结构检查都发现不了。来源中执行规范把身份落地划给编排者在资源阶段之后单独调用，编排者推进阶段时漏掉；资源迁移任务整文件重写 entry string.json 时只改了 app_name，EntryAbility_label 保留脚手架值，AppScope 的 app_name 从生成到验证都没人写过，直到 App 身份校验才修。"
    how:
      - "从 AppScope/app.json5 的 label 和 module.json5 里入口 Ability 的 label 各解析出 $string 键，分别在 AppScope/resources/base/element/string.json 与 entry/src/main/resources/base/element/string.json 中改值，值取 Android strings.xml 里被 android:label 引用的字符串。"
      - "改完读回两个文件，确认两处值都等于 Android 应用名，没有残留脚手架工程名。"
    evidence:
      - case: "case-7b64dd743c1260eb910f"
        claim: diagnosis
        revision: "e90dd8c8b7566e376643ae6fadacfd392f54aabdf97cab6c96337422c88a1948"
      - case: "case-7b64dd743c1260eb910f"
