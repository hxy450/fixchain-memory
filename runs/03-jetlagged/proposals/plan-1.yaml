  - title: "横向滚动容器给交叉轴写数值高度，按内容算出，不写 'auto' 也不留空"
    topic: [ui, layout]
    when: "界面实现阶段，把 Compose 可滚动 Tab 行、LazyRow、horizontalScroll 等按内容定高的横向滚动行翻译成 ArkUI 滚动容器时"
    description: "源端横向滚动行的高度由子项固有高度决定；目标用 Scroll(ScrollDirection.Horizontal) 或横向 List/Grid 实现，所在父容器在纵向上还有剩余空间。"
    why: "ArkUI 滚动容器的交叉轴不随内容收缩，横向不设高度时会撑满父级剩余高度；工程迁移陷阱表记有同一条，纵向缺宽度同理。来源的 Tab 行写了 .height('auto') 并注释为“自适应内容”，设备实测（API 12 模拟器）Scroll 仍被撑到约 597vp，行内选中格跟着放大，后几项被挤出视口。生成者没读到陷阱表里这一条，只凭另一个组件属性注释中的 auto 字样推断可用。"
    how:
      - "交叉轴高度取最高子项高度加上下内边距或外边距：单行文本项可按字号对应的单行高度加上下 padding 计算，已有设备测量值时以测量值为准。"
      - "写完 grep 横向 Scroll/List/Grid 的链式属性，确认有数值 .height()；拿不准时列为设备必验项。"
    check:
      - "对高度有疑问且能上设备时，用 dumpLayout 看滚动容器的高度是否与子项高度一致。"
    evidence:
      - case: "case-2018daf21990f553ec22"
        claim: diagnosis
        revision: "e73ba5bd838a18a9b94e05e12dbfae2f0ecffa50fd8f3932e49acdca470eb753"
      - case: "case-2018daf21990f553ec22"
        claim: recommendation:1
        revision: "e73ba5bd838a18a9b94e05e12dbfae2f0ecffa50fd8f3932e49acdca470eb753"
    requires: []
    status: active
  - title: "贴合内容的描边、选中背景画在由内容定尺寸的节点自身，不用 width/height('100%') 覆盖层"
    topic: [ui, layout]
    when: "界面实现阶段，翻译用 fillMaxSize()、matchContentSize 贴合内容的选中指示器、描边或背景时"
    description: "源端指示器或背景层以 fillMaxSize、matchContentSize 贴合某个由内容定尺寸的格子；目标准备在 Stack/Row 里叠一层 width/height('100%') 的节点来画描边或背景。"
    unless:
      - "父节点有确定的宽高（显式数值，或已被外层约束定死）时，百分比层按该尺寸解析，可以使用"
    why: "ArkUI 的百分比尺寸在由内容定尺寸的父级里会向上取到最近的确定尺寸，把格子撑大（工程迁移陷阱表与设备实测一致）。来源中选中格内的 height('100%') 描边层解析到被撑高的 Tab 行高度，选中格变成约 299×597vp；与横向 Scroll 未定高叠加后，首帧只看得到前两项。"
    how:
      - "描边、背景直接写在内容节点上（.border()、.backgroundColor()、.borderRadius()），描边与内容的间距用 padding 表达；源端描边相对内容有内缩时，把内缩量拆到外层与内容节点的 padding 里。"
      - "选中与未选中两态保留同样宽度的描边，未选中用 Color.Transparent，切换时尺寸不变。"
      - "写完 grep width('100%') 与 height('100%')，逐处确认父级有确定尺寸。"
    evidence:
      - case: "case-2018daf21990f553ec22"
        claim: diagnosis
        revision: "e73ba5bd838a18a9b94e05e12dbfae2f0ecffa50fd8f3932e49acdca470eb753"
      - case: "case-2018daf21990f553ec22"
        claim: recommendation:2
        revision: "e73ba5bd838a18a9b94e05e12dbfae2f0ecffa50fd8f3932e49acdca470eb753"
    requires: []
