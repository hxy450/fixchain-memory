  # ---------- 新增：ui/interaction 点击持有节点 ----------
  - title: "点击事件挂在源布局真正持有点击的节点上；清理重复绑定时保留整栏容器的事件"
    topic: [ui, interaction]
    when: "界面实现与返修阶段，为由多个子控件拼成的搜索栏、入口条决定 onClick 挂在哪一层，或清理其中的重复点击绑定时"
    description: "源布局只在整条容器上绑定点击（如 LinearLayout 的 onClick 或 DataBinding 点击），内部图标、提示文字、“搜索”字样只负责展示；目标用 Row + Image + Text 模拟占位搜索框（不是 TextInput），点击后压栈进入目标页。"
    unless: []
    why: "给子控件额外挂同一回调会形成重复绑定；返修若按“重复绑定会重复压栈”的推测删掉外层容器的事件，整栏就只剩子控件可点，点中间提示区没有反应。来源中生成期写者正确绑定了整栏，又给“搜索”文字多挂了同一回调；返修者没查源布局也没复现，就删了整栏事件、保留文字事件，用户随即报告搜索框点击没反应。"
    how:
      - "onClick 按源布局里持有点击的节点挂：源端只有外层容器可点时只给外层 Row 绑定，不给文字、图标子控件再挂同一跳转。"
      - "清理重复点击时先查源布局的点击持有者和视觉点击区域，保留覆盖整栏的外层事件、删除子控件事件；“重复压栈”一类推测先用日志或设备复现确认再改。"
    check:
      - "改完点搜索栏中间的提示区，确认外层节点 clickable=true，且只进入一次目标页。"
    evidence:
      - {case: case-adacd41d159c24498006, claim: diagnosis, revision: 74e74cc569c9c74fa3bebafd61c9937ac36696d9a4ea53d849a4265f6d703325}
      - {case: case-adacd41d159c24498006, claim: "recommendation:1", revision: 74e74cc569c9c74fa3bebafd61c9937ac36696d9a4ea53d849a4265f6d703325}
      - {case: case-adacd41d159c24498006, claim: "recommendation:2", revision: 74e74cc569c9c74fa3bebafd61c9937ac36696d9a4ea53d849a4265f6d703325}
      - {case: case-adacd41d159c24498006, claim: "recommendation:3", revision: 74e74cc569c9c74fa3bebafd61c9937ac36696d9a4ea53d849a4265f6d703325}
    requires: []
    status: active
