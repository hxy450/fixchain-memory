  - title: "修复安全区等按关键字判定的结构检查时逐页落实实现，不用含检查关键字的注释让检查通过"
    topic: [process, gates]
    when: "结构修复阶段处理安全区 Layer 3 等按关键字或 grep 判定的检查失败时"
    description: "结构检查按关键字或 grep 判断页面是否处理了安全区等要求；修复者面对多页 FAIL，工程有共享窗口模型（顶部/底部避让值），skill 要求每个全屏 NavDestination 页实际加 padding。"
