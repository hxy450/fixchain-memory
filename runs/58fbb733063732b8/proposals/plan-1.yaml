  # ---------- 新增：arkts/async 输入初值先于 await ----------
  - title: "异步初始化里，用户可编辑的输入状态在第一个 await 之前写入初值"
    topic: [arkts, async]
    when: "ViewModel 实现阶段，编排页面初始化方法中异步存储/SDK 绑定与输入状态初值的先后顺序时"
    description: "源页面在初始化时同步写入关键词或输入框文本，操作读取实时输入；目标输入框双向绑定 ViewModel 字段，初始化方法内含 await（存储、历史、SDK 绑定），页面生命周期回调以不等待的方式调用它。"
    unless: []
    why: "页面不等初始化完成就可编辑；续体里较晚到达的初值赋值会覆盖用户已输入的文字，点击操作读到空值，表现为“点了没反应”。来源中写者读到源端先同步设置关键词与输入框，却把赋值放到 await 绑定之后；后续写者又在 await 链前插入更多异步步骤，顺序一直保留到返修。"
    how:
      - "把源端同步设置的输入类状态（关键词、输入框文本、清除按钮可见性）放在第一个 await 之前赋值；异步步骤只加载数据，不在续体里回写用户可编辑字段。"
