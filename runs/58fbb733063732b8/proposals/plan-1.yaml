      - {case: case-5fcc464cf9b9cd1034f1, claim: "recommendation:2", revision: 264d0a27c2fadfb0c89259afa0229fb8e188bc5ac27976eae10ead1e8a1f1ae1}
    requires: []
    status: active

  # ---------- 新增：app/startup 异步装配就绪门 ----------
  - title: "首屏依赖异步装配的服务时，用可等待、失败可复位的就绪门，await 后再计算路由；读到空服务不静默沿用默认路由"
    topic: [app, startup]
    when: "入口装配与启动链路接线阶段，把启动服务改为由 EntryAbility 异步装配到组装根、首屏从组装根取依赖并决定下一页时"
    description: "EntryAbility.onCreate 以不等待的方式启动异步装配（先 await 数据库等初始化再写服务槽），随即 loadContent 入口页；首屏在 onReady 同步读取服务槽并按启动决策路由；启动 ViewModel 有指向首屏自身的默认路由。"
    unless: []
    why: "首屏渲染可能早于装配完成；读到空槽静默返回并沿用默认路由，结果把首屏再推一遍，表现为进度到头仍停在启动页，且没有任何错误输出。来源中收尾者读到了不等待的装配、先 await 数据库再发布服务、默认路由指向启动页，以及“从组装根取依赖、不得静默吞错”的契约，仍把服务改成异步写入的可空槽，并在为空时静默返回。"
    how:
      - "组装根提供幂等的就绪门（缓存同一个 Promise，失败时复位以便重试），EntryAbility 与首屏共用；首屏 await 它之后再读服务、计算路由。"
      - "装配时先发布路由决策所需的服务，数据库等与路由无关的慢初始化放在其后。"
      - "路由决策仍等于当前首屏或服务为空时按失败处理：显示可重试的错误并记录日志，不静默返回。"
    evidence:
      - {case: case-5fcc464cf9b9cd1034f1, claim: diagnosis, revision: 264d0a27c2fadfb0c89259afa0229fb8e188bc5ac27976eae10ead1e8a1f1ae1}
