  # ---------- 新增：app/map 定位权限组 ----------
  - title: "APPROXIMATELY_LOCATION 与 LOCATION 按一组判定：任一授予就继续定位，不套用“全部授予”的通用权限模板"
    topic: [app, map]
    when: "定位能力实现阶段，编写定位权限申请结果的判定逻辑时"
    description: "目标同时申请 ohos.permission.APPROXIMATELY_LOCATION 与 ohos.permission.LOCATION；工程 skill 提供通用的权限辅助模板（遍历 authResults，任一不为 0 即返回失败）；功能规格只要求两项权限都声明、都处理。"
    unless: []
    why: "用户可以只授予模糊位置，此时精确权限为拒绝；按“全部授予”判定会把这种情况当成无权限，定位按钮直接失败。来源中实现者照搬通用模板写出全部授予的循环，skill 与规格都没有说明定位权限组可以只授予模糊位置。"
    how:
      - "authResults 中任一定位权限授予（至少模糊位置为 0）就继续定位；只有精确权限缺失时按降级精度处理，两项都拒绝才走失败提示。"
    evidence:
      - {case: case-f9c6cd0dc22c13bdcdd8, claim: diagnosis, revision: 4e72a33317fb5f7c1fd3617a687663355b2c1668c701309be3719fa44a00572a}
      - {case: case-f9c6cd0dc22c13bdcdd8, claim: "recommendation:1", revision: 4e72a33317fb5f7c1fd3617a687663355b2c1668c701309be3719fa44a00572a}
    requires: []
    status: active

  # ---------- 新增：app/map 原生地图替换占位 ----------
  - title: "用原生地图 SDK 替换占位地图时，把页面已有的定位出口接到相机与当前位置显示，并在系统定位与高德底图之间做坐标转换"
    topic: [app, map]
    when: "三方地图接入阶段，用高德等原生地图组件替换占位地图、决定定位结果如何驱动地图相机与当前位置显示时；从参考桥接裁剪能力时"
    description: "页面原先只有占位地图，定位按钮调用的地图 provider 只缓存中心坐标；定位来源是系统 geoLocationManager（WGS-84），新底图为高德（GCJ-02）；参考工程的桥接类含 recenter/moveCamera、就绪前暂存中心与坐标适配器。"
    unless: []
    why: "替换底图只接了初始化与生命周期时，页面的定位出口仍指向缓存型 provider，按钮看似没有反应；接上相机后若不转换坐标，中心点会与蓝点偏移。来源中移植者读到了参考桥接的 recenter、就绪前暂存中心和完整的 WGS-84→GCJ-02 适配器，也读到“地图服务只是保存中心点”的核查结论，写出的桥接仍刻意只保留生命周期，页面定位路径没有改。"
    how:
      - "列出页面现有的地图状态出口（中心更新、定位按钮回调、标记），逐一接到原生地图：定位成功后 moveCamera(newLatLngZoom(...)) 并启用当前位置显示（MyLocationStyle 与 setMyLocationEnabled）；地图尚未就绪时暂存中心，就绪后再应用。"
      - "定位来源为系统定位（WGS-84）而底图为高德（GCJ-02）时，进入相机前用 SDK 的 CoordinateConverter（GPS 类型）或参考工程的坐标适配器转换。"
      - "从参考桥接有意裁剪能力时，按用户可见入口逐项确认裁剪后仍有效；页面仍依赖的 recenter、坐标适配要保留，或登记为未完成。"
    evidence:
      - {case: case-f9c6cd0dc22c13bdcdd8, claim: diagnosis, revision: 4e72a33317fb5f7c1fd3617a687663355b2c1668c701309be3719fa44a00572a}
      - {case: case-f9c6cd0dc22c13bdcdd8, claim: "recommendation:2", revision: 4e72a33317fb5f7c1fd3617a687663355b2c1668c701309be3719fa44a00572a}
      - {case: case-f9c6cd0dc22c13bdcdd8, claim: "recommendation:3", revision: 4e72a33317fb5f7c1fd3617a687663355b2c1668c701309be3719fa44a00572a}
      - {case: case-f9c6cd0dc22c13bdcdd8, claim: "recommendation:4", revision: 4e72a33317fb5f7c1fd3617a687663355b2c1668c701309be3719fa44a00572a}
    requires: []
    status: active

  # ---------- 新增：app/map 原生地图在 Tab 页的生命周期与触摸 ----------
  - title: "原生地图组件接入 Swiper/Tabs 预构建的页面：可见时初始化或恢复、隐藏时暂停、卸载才释放，并显式写出地图与覆盖层的触摸分工"
    topic: [app, map]
    when: "三方地图接入阶段，把参考工程的原生地图组件接入本工程已有页面，确定初始化、暂停、释放的挂载点与触摸分工时"
    description: "目标页面作为 Swiper/Tabs 子页被宿主一次性预构建；页面在高德 MapViewComponent 等原生 XComponent 地图之上叠放搜索栏、按钮等 ArkUI 覆盖层；参考桥接把激活/暂停与完整释放分成不同接口。"
    unless: []
    why: "预构建的隐藏子页也会走 onReady；在其中创建原生地图、在 onDisAppear 完整释放，会在页面仍挂载时销毁原生组件，设备日志出现 napi_unwrap fail。原生地图铺满页面又没有声明触摸分工时，上层控件的点击可能被地图接走。来源中移植者读到了参考桥接把激活/暂停与释放分开、MapView 的暂停与销毁接口，也在检索结果里看到页面由主页直接创建，仍在 onReady 初始化、在 onDisAppear 释放；它只读了参考工程的 adapter 目录，没读真正承载地图、给覆盖层设 HitTestMode 的页面。触摸修复与主页 Swiper 的禁用修复同批安装，地图是否独立拦截点击未单独验证。"
    how:
      - "接入前查页面在哪里实例化；位于 Swiper/Tabs 等预构建容器时，原生地图在页面实际可见（onAppear 或选中回调）时初始化或恢复，隐藏时调用暂停接口，完整释放只放在真正卸载时。"
      - "服务层同时暴露初始化、暂停/恢复与释放接口，页面按可见性调用，不以释放代替暂停。"
      - "在原生地图上叠放 ArkUI 控件时写明触摸分工：地图需要手势就让全尺寸覆盖容器用 HitTestMode.Transparent；只作视觉层就给 MapViewComponent 设 HitTestMode.None。"
      - "移植参考工程的地图组件时，同时读参考工程里真正承载地图的页面，按其覆盖层触摸与生命周期调用方式迁移。"
    check:
      - "真机逐个点击覆盖层控件，并与容器 enabled 等其他可能禁用点击的因素分开验证。"
    evidence:
      - {case: case-31b1116c0e0aec40a307, claim: diagnosis, revision: 5a02a1cc2d45078c486731f77a3265771ebc47f891c7b2533ae978c545a1d79c}
      - {case: case-31b1116c0e0aec40a307, claim: "recommendation:1", revision: 5a02a1cc2d45078c486731f77a3265771ebc47f891c7b2533ae978c545a1d79c}
