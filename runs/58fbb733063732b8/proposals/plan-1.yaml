topic_descriptions:
  app: "应用级入口与横切约定：入口 Ability 的初始化、平台级守护与 skills 声明，冷启动链路与首屏就绪，Flutter 混合工程的原生桥接，日志写法、应用身份、设置项、平台能力与厂商 SDK 选型（含蓝牙、常驻通知）、地图与定位 SDK 接入，以及媒体保存/导入"
  app/map: "地图与定位 SDK 接入（如高德鸿蒙 SDK）：各产品单例的隐私与 Key 初始化、查询参数契约、定位权限组判定、定位结果到相机与坐标系转换、原生地图组件在 Tab 页中的生命周期与触摸分工"
  app/platform: "系统平台能力（后台任务、通知与常驻通知的订阅归属、画中画回退、动态取色、地图承载）的实现、替代与降级，厂商 SDK 鸿蒙版本的查询与选型，以及后台计时的恢复和退出清理"
  app/startup: "冷启动链路：闪屏路由、各去向页的初始化请求、登录态组合在哪里处理，以及首屏等待异步装配完成的就绪门"
  process: "迁移流程中的阶段交接与写前输入：迁移范围的确定，规格与二手产物的核对，必读材料与源布局是否读全，跨任务移交的登记与兑现，结构检查与自愈脚本的收口"
  process/spec-handoff: "规格、已生成代码等二手输入与源码之间的交接：规格条目的写法、上游产物缺值时如何收口、概括出错、照搬前核对与冲突回报，多模块同名布局的解析，合成快照清单的可信度"
  process/gates: "结构检查与自动修复的收口：会改写源码的自愈脚本运行后审阅改动，按关键字判定的检查要真实落实而不是迎合检查器"
  ui/navigation: "多屏拆成多页面后的导航：入口 Navigation 宿主与首屏入栈，Tab/Swiper 子页的导航栈来源，目的地命名与参数（含多入口共享载荷），返回栈重建、同一结果的单一导航出口、跳转前的状态交接、返回键分发、挂载与生命周期归属"
  ui/safearea: "沉浸式安全区：避让区测量与 px/vp 换算（状态栏、导航指示条），系统栏图标深浅，全屏页底部按钮与贴底弹层的避让，逐页落实前景避让"
  ui/state: "ArkUI V2 状态刷新与订阅：@Builder 参数、复用开关组件的事件值、页面与共享模型的绑定、共享状态 key 的命名、按状态显隐、事件驱动的重新加载、ForEach 键与子组件刷新、监听的注册与释放、乐观更新与访问器兜底"
