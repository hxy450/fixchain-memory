  # ---------- 新增：ui/navigation Swiper 子页的导航栈 ----------
  - title: "嵌在 Swiper/Tabs 里的页面组件只用 @Consumer 注入的根 NavPathStack，不在 onReady 用 context.pathStack 覆盖"
    topic: [ui, navigation]
    when: "页面转换与主壳接线阶段，为由主页 Tab/Swiper 承载的 Fragment 页确定导航栈来源、编写 onReady 时；把已有页面接入主页 Swiper/Tabs 时"
    description: "Android 主 Activity 用 ViewPager/底部 Tab 承载多个 Fragment；目标由入口页 Navigation 以 @Provider 提供根 NavPathStack，主页 Swiper 嵌入各 Tab 页组件，子页用 @Consumer('navPathStack') 取栈，外层仍保留 NavDestination 与 onReady；工程里经 pushPathByName 压栈的页面普遍在 onReady 写 this.navPathStack = context.pathStack。"
    unless:
      - "页面本身经 pushPathByName 压入根栈、不在 Swiper/Tabs 子树内时，onReady 的 context.pathStack 就是根栈，该赋值无害"
    why: "嵌入 Swiper 子树的 NavDestination 在 onReady 拿到的是嵌套视觉目的地的栈，不是入口页的根栈；用它覆盖注入栈后，点击处理压到隔离栈上看似无反应，或在真机上报 pushPathByName is not callable 直接崩溃。来源中两位转换者的定义已给出 @Consumer 注入、onReady 只读参数、Tab 子页不套 NavDestination 的模板，却照搬工程内压栈页的写法；页面后来被接入主页 Swiper 才出错。"
    how:
      - "Tab/Swiper 承载的子页只用 @Consumer('navPathStack') 注入的根栈；onReady 只读取 pathInfo.param，不写 this.navPathStack = context.pathStack。"
      - "参照已有页面前先判断本页是压栈的 NavDestination 还是嵌入 Swiper/Tabs 的子组件；压栈页的栈赋值不照搬到 Tab 子页，套用安全区等模板时只取所需部分。"
      - "把页面接入主页 Swiper/Tabs 时，一并删掉被嵌入页面里的 context.pathStack 赋值。"
    check:
      - "接入后对被嵌入的子页检索 pathStack = context.pathStack，应无命中。"
    evidence:
      - {case: case-1740a4d06903ea105e81, claim: diagnosis, revision: c37ded9e79d87b67ef66a6e7bfb6e2a2481200556e508b713c864d90ab618411}
      - {case: case-1740a4d06903ea105e81, claim: "recommendation:1", revision: c37ded9e79d87b67ef66a6e7bfb6e2a2481200556e508b713c864d90ab618411}
      - {case: case-1740a4d06903ea105e81, claim: "recommendation:2", revision: c37ded9e79d87b67ef66a6e7bfb6e2a2481200556e508b713c864d90ab618411}
      - {case: case-1740a4d06903ea105e81, claim: "recommendation:3", revision: c37ded9e79d87b67ef66a6e7bfb6e2a2481200556e508b713c864d90ab618411}
    requires: []
    status: active

  # ---------- 更新：process/spec-handoff 沿用已有写法 ----------
  - id: lesson-e9c6e8ef1b29a6fe9c26
    title: "沿用已生成页面、兄弟任务的写法或已有解析函数前，回到源码核对该片段的语义"
    topic: [process, spec-handoff]
    when: "页面转换、公共组件抽取、切片接线或页面重建阶段，参照已生成页面中的同名控件、弹窗、列表、顶栏或导航栈写法时；数据层为新增接口方法复用已有的解析、封装函数时；复用工程已有的共享状态 key 时"
    description: "后写的 worker 同时读到源码与先前 agent 已生成的目标代码片段（@Builder 控件、输入弹窗、弹窗承载方式、列表键函数、顶栏折叠、图标控件行、安全控件样式、全屏遮罩、onReady 取栈写法、共享状态 key、登录结果解析函数等），准备当作项目约定直接沿用。"
    unless: []
    why: "已生成片段可能带着偏差，照搬会把它复制到新文件，形成多处同源缺陷。来源跨多个应用：公共组件逐字沿用页面里的 @Builder 值参写法与输入框 onChange 限长，列表页重建沿用只含 id 的 ForEach 键；另一应用里两位设置页转换者都读到了源端连续折叠顶栏的写法，前一位沿用兄弟页的两态近似并称之为项目约定，后一位把前一位的输出当作“约定锚点”再抄一次；第三个应用里写者读到源端新登录方法从响应头取凭证，仍复用了已有的按响应体解析的函数，把同一偏差扩到新方法。写者都读过源码，却以已有代码为准。第四个应用里多处沿用：个人资料页照抄周铃页把 V2 组件交给 CustomDialogController 的写法并推断“builder 接受任意组件”，本地播放页照抄网络播放页满盒 Contain 的图标行，多个页面沿用透明底 SaveButton 的“范式”，修复时又以“壁纸页同款”接受了授权窗口风险。第五个应用里，Tab 子页转换者照搬压栈页在 onReady 取 context.pathStack 的写法，页面嵌入 Swiper 后点击失效或崩溃；多个写者把工程里已有的连字符共享状态 key 当作命名约定继续使用。这些先例本身都没有经过运行验证。"
    how:
      - "沿用前逐个核对片段在源码里对应的行为：参数是否随状态变化、输入约束是否真的阻止显示、条目更新后键是否变化、折叠是否连续、取值来源（响应头还是响应体）是否相同、本页与先例页的挂载方式（压栈还是嵌入容器）是否相同；核对通过再落盘，已有代码不能代替对源码的核对。"
      - "已有写法与本处源码不一致时按源码实现，并在报告写明差异，不把近似复制到新文件。"
      - "先例本身没有经过运行验证（弹窗打开路径、真机截图）时，不以“先例能用”推断可运行；某处写法被修复后，搜索同一写法的其他页面一并核对。"
    evidence:
      - {case: case-c4b0a71b1ff405c63013, claim: diagnosis, revision: 5ebdbf66024684c95001aad09cb433f96286d15123326f1e60b5848cef16611f}
      - {case: case-c4b0a71b1ff405c63013, claim: "recommendation:3", revision: 5ebdbf66024684c95001aad09cb433f96286d15123326f1e60b5848cef16611f}
