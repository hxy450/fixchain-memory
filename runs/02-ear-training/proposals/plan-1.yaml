  - title: "沿用已生成页面或兄弟任务的写法前，回到源码核对该片段的语义"
    topic: [process, spec-handoff]
    when: "公共组件抽取、切片接线或页面重建阶段，参照已生成页面中的同名控件、弹窗或列表写法时"
    description: "后写的 worker 同时读到源码与先前 agent 已生成的目标代码片段（@Builder 控件、输入弹窗、列表键函数等），准备直接沿用。"
    why: "已生成片段可能带着偏差，照搬会把它复制到新文件，形成多处同源缺陷。来源三例：公共组件逐字沿用页面里的 @Builder 值参写法与输入框 onChange 限长，列表页重建沿用只含 id 的 ForEach 键；三处写者都读过源码，却以兄弟代码为准。"
    how:
      - "沿用前逐个核对片段在源码里对应的行为：参数是否随状态变化、输入约束是否真的阻止显示、条目更新后键是否变化；核对通过再落盘，兄弟代码不能代替对源码的核对。"
    evidence:
      - case: "case-c4b0a71b1ff405c63013"
