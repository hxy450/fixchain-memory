  - title: "列表条目以新对象替换时，ForEach 键要包含会变且需要显示的字段"
    topic: [ui, state]
    when: "功能实现与页面接线阶段，为可编辑列表选定条目更新方式与 ForEach 键时"
    description: "列表条目编辑（如改名）后以保留 id 的新对象替换，ArkUI 用 ForEach 渲染并把条目字段作为子组件的 @Param 传入；源端是 Compose 不设 key 的 forEach 加不可变 copy 更新。"
    unless:
      - "更新方式是对 @ObservedV2 条目的 @Trace 字段原地赋值，子组件绑定的仍是同一对象，此时可保留只含 id 的键"
    why: "ForEach 键值不变时复用已有子组件、不再执行条目构建，子组件拿不到替换后的新对象，界面停在旧值；Compose 不设 key 的 forEach 每次重组都拿到新对象，所以源端没有这个问题。来源中改名后反馈与持久化都已更新，卡片仍显示旧名；只含 id 的键由早期页面写入、重建时被沿用，写码者读到的状态参考只讲“替换实例会触发刷新”，没有覆盖同键复用。"
    how:
      - "先定更新方式：替换对象就把会变且显示的字段并入键，如 `${item.id}:${item.name}`；改为给 @Trace 字段原地赋值则可保留 id 键。"
      - "对每个修改动作核一遍：动作 → 数组元素是否换成新对象 → ForEach 键是否变化 → 子组件 @Param 绑定的是哪个对象，确认新值能到达条目 UI。"
