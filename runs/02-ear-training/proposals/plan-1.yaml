upsert:
  - title: "catch 中继续抛出时先把异常收窄为 Error，不直接 throw catch 变量"
    topic: [arkts, strict-mode]
    when: "功能实现或修复阶段，在 try/catch 中决定把捕获到的异常继续向上抛出时"
    description: "ArkTS 严格模式工程中，catch 分支需要把当前任务的异常继续上报（例如过期任务的异常按取消处理、当前任务的异常上报），catch 变量没有 Error 类型保证；写码批次按约束不自行编译，或修改落在组编译之后。"
    unless:
      - "抛出的值已经在同一分支里由 instanceof Error 等判断收窄为 Error"
    why: "ArkTS 只允许 throw Error 及其子类，catch 变量类型未定，原样 `throw error` 会在编译时报 arkts-limited-throw（10605087）。来源中这条规则写在派工要求预加载的 skill 里，但 worker 批量读取 skill 时输出被截断，规则没有进入上下文；这次修改又落在组编译之后、worker 不能自行编译，错误一直留到终态全量编译才暴露。"
    how:
      - "需要 rethrow 时写成 `throw error instanceof Error ? error : new Error(String(error))`，或抛出带原因说明的新 Error。"
      - "编译门之后落地、又不能自行编译的修改，写完用 rg 查 `throw [A-Za-z_]+;` 这类直接抛变量的语句，并对照 hmos-fix-build-errors 错误表里的 ArkTS 严格模式条目自查。"
    evidence:
