- title: 自定义组件的状态成员不与组件通用属性方法同名（position、width、height、id、visibility、enabled、zIndex、opacity 等）
  topic:
  - arkts
  - decorators
  when: 规格提取阶段为组件状态接口表命名 @Local/@Param 变量，或界面实现阶段在自定义组件 struct 中声明成员时
  description: 把源端事件或模型的字段名（如播放进度事件的 position）直接转写成组件成员；规格的状态接口表就是实现的成员表，实现者按表照写。
  unless: []
  why: '自定义组件继承的 CustomComponent 上已有同名的通用属性方法，成员与之同名时赋初值会被当成给该方法赋值，编译报 Type ''number'' is not assignable to type ''(value: Position | Edges | LocalizedEdges) => CommonAttribute'' 一类错误。来源中规格作者与实现者都预载了列出这些保留名的规则，仍沿用源字段名 position；偏差先在规格表形成，实现者照写时又没有对照。'
  how:
  - 把源字段名转成成员名前对照组件通用属性清单（position、width、height、id、visibility、enabled、zIndex、opacity 等），同名就改为带语义前缀的名字（如 playbackPosition），并在规格表里写出成员名与源字段的对应。
  - 实现时即使规格已给出成员名也再对照一次；该限制适用于所有自定义组件 struct，不只页面。发现规格名冲突时改名并回写规格。
