topic_descriptions:
  app: 应用级入口与横切约定：入口 Ability 的初始化、平台级守护与 skills 声明，冷启动链路与首屏就绪，Flutter 混合工程的原生桥接，日志写法、应用身份、设置项、平台能力与厂商 SDK 选型（含蓝牙、常驻通知）、地图与定位 SDK 接入，以及媒体保存/导入，以及资源批量转换（values 转 element JSON、drawable 转 media）的输出格式与命名
  app/resources: 资源批量转换：Android values 转 element JSON（颜色值形态、数组项结构、引用写法）与 drawable 转 media（反编译 APK 的内联片段、资源文件名合法性），以及宣布资源阶段完成前的产物校验
  arkts: ArkTS 语言与 SDK 接口：类型、签名、V2 组件成员声明、严格模式限制与异步错误路径，以及不能编译时的写后自检
  arkts/api-signatures: 调用 ArkUI 组件属性方法或 SDK 接口时的参数类型、重载匹配与必填参数，成员名、所属类型与返回可空性的声明核对：@BuilderParam 传入 builder 的写法与 this 绑定，intl 格式化等接口不能省略的参数
  arkts/decorators: ArkUI V2 自定义组件的成员声明：装饰器是否带括号、@BuilderParam 默认值的写法、状态成员名与组件通用属性方法的冲突
  ui/dialog: 弹窗与半模态：V2 页面可用的弹窗载体、sheet 内二级弹窗的层级、按源 Dialog 类型选择呈现形态（路由约束不改变弹窗形态）、弹窗内二级选择器的层级、按源布局还原弹窗内容、源 Dialog 用 setView 注入自定义内容时的承载方式
  ui/list: 列表与宫格：多类型 Adapter 页面的 item 布局与绑定分支（默认态、文案模板、附属子卡），分页加载的并发门闩与刷新互斥，多列 Grid 中占位与跨列项的排布，列表项主副行与空值回退，多组列表的数据源绑定与级联选择，列表项滑动操作（swipeAction）的挂载位置
  ui/interaction: 点击命中与遮罩：Stack 叠层的 hitTestBehavior、贴底栏定位壳与页面级全屏遮罩的挂载方式、覆盖层对下层控件点击的影响、点击事件挂在哪一层节点，以及控件点击处理器副作用（音效、振动、持久化、面板）的迁移，以及 Button 等单子组件容器内按状态切换内容的写法
  ui/layout: 容器选择、约束与定位（ConstraintLayout、RelativeContainer、RelativeLayout 无相对规则子项的叠放、Column、Stack 内子项的纵向定位等），默认对齐差异、百分比尺寸与 margin、并排 wrap_content 列的宽度分配、跟随等高、滚动容器的包含范围、运行时挂载层与锚点转换、随滚动折叠的顶栏、全屏底层与状态覆盖层骨架、gone 节点与列表 item 布局，以及视觉修复中固定尺寸的依据；方向相关边距（start/end）的 LengthMetrics 写法
